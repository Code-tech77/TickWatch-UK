<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TickWatch UK · Elanco Tick Sightings Tracker (Mohammed Zuoriki)</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Intro splash: plain HTML/CSS/JS so it shows instantly, before React and Babel have loaded -->
<div id="splash" role="status" aria-label="Loading TickWatch UK">
  <i class="sp-ring"></i><i class="sp-ring r2"></i>
  <div class="sp-col" aria-hidden="true">
    <div class="sp-stage">
      <div class="sp-slab"></div>
      <div class="sp-word"><span>E</span><span>l</span><span>a</span><span>n</span><span>c</span><span>o</span></div>
      <div class="sp-shine"></div>
      <sup class="sp-tm">TM</sup>
    </div>
    <p class="sp-tag">TickWatch UK</p>
    <div class="sp-bar"><i></i></div>
  </div>
</div>
<div id="root"><p style="font-family:sans-serif;padding:24px">Loading TickWatch UK… (needs an internet connection)</p></div>
<!-- must come after #root so it can find it -->
<script src="splash.js"></script>
<script src="config.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
